  PublicSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Publicsecuritygroup
      VpcId: !Ref kubevpc
      SecurityGroupIngress:
        # SSH from your laptop
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 49.207.217.69/32

        # Allow all traffic from within the VPC
        - IpProtocol: -1
          CidrIp: 10.0.0.0/16

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  PrivateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Privatesecuritygroup
      VpcId: !Ref kubevpc
      SecurityGroupIngress:
        # Allow all traffic from the Controller/NAT SG
        - IpProtocol: -1
          CidrIp: 10.0.1.0/24

        # Allow communication between worker nodes
        - IpProtocol: -1
          CidrIp: 10.0.2.0/24

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
