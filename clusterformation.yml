Resources:
  kubevpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: KubeVPC
          Value: Kubernetes
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref kubevpc
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGatewaykube
      VpcId: !Ref kubevpc
  InternetGatewaykube:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: KubeVPC
          Value: Kubernetes
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref kubevpc
      CidrBlock: 10.0.2.0/24
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref kubevpc
      Tags:
        - Key: route
          Value: public
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewaykube
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref kubevpc
      Tags:
        - Key: route
          Value: private
  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet

  EC2SSMROLE:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: 
          - Effect: "Allow"
            Principal: 
              Service: 
                - "ec2.amazonaws.com"
            Action: 
              - "sts:AssumeRole"
  Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EC2SSMpolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: 
              - ssm:GetParameter
              - ssm:PutParameter
            Resource: '*'
      Roles: 
        - !Ref EC2SSMROLE
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2SSMROLE
  controllernode:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}"
      InstanceType: t2.medium
      KeyName: controller-node
      SourceDestCheck: false
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref PublicSecurityGroup
          SubnetId: !Ref PublicSubnet
          PrivateIpAddress: 10.0.1.174
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eux

          export DEBIAN_FRONTEND=noninteractive

          # Update packages
          apt-get update

          # Install iptables persistence
          apt-get install -y iptables-persistent netfilter-persistent

          # Enable IP forwarding immediately
          sysctl -w net.ipv4.ip_forward=1

          # Enable IP forwarding permanently
          echo "net.ipv4.ip_forward=1" >> /etc/sysctl.conf
          sysctl -p

          # Detect the primary network interface (ens5, eth0, etc.)
          IFACE=$(ip route | awk '/default/ {print $5}')

          # Configure NAT
          iptables -t nat -A POSTROUTING -o ${IFACE} -j MASQUERADE
          iptables -A FORWARD -i ${IFACE} -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          iptables -A FORWARD -o ${IFACE} -j ACCEPT

          # Save iptables rules
          netfilter-persistent save
          systemctl enable netfilter-persistent

          export DEBIAN_FRONTEND=noninteractive

          # ----------------------------------------------------
          # Hostname ----------------------------------------------------
          hostnamectl set-hostname master

          # ----------------------------------------------------
          # Update system
          # ----------------------------------------------------
          apt-get update
          apt-get upgrade -y

          # ----------------------------------------------------
          # /etc/hosts (replace with your actual private IPs)
          # ----------------------------------------------------
          cat <<EOF >> /etc/hosts
          10.0.1.174 master
          10.0.2.211 worker1
          10.0.2.167 worker2
          EOF

          # ----------------------------------------------------
          # Disable swap
          # ----------------------------------------------------
          swapoff -a
          sed -i '/ swap / s/^/#/' /etc/fstab

          # ----------------------------------------------------
          # Kernel modules
          # ----------------------------------------------------
          cat <<EOF | tee /etc/modules-load.d/k8s.conf
          overlay
          br_netfilter
          EOF

          modprobe overlay
          modprobe br_netfilter

          # ----------------------------------------------------
          # Sysctl
          # ----------------------------------------------------
          cat <<EOF >/etc/sysctl.d/k8s.conf
          net.ipv4.ip_forward=1
          net.bridge.bridge-nf-call-iptables=1
          net.bridge.bridge-nf-call-ip6tables=1
          EOF

          sysctl --system

          # ----------------------------------------------------
          # Install prerequisites
          # ----------------------------------------------------
          apt-get install -y software-properties-common curl gpg apt-transport-https ca-certificates

          # ----------------------------------------------------
          # Install CRI-O
          # ----------------------------------------------------
          KUBERNETES_VERSION=v1.35

          mkdir -p /etc/apt/keyrings

          curl -fsSL https://pkgs.k8s.io/addons:/cri-o:/stable:/${KUBERNETES_VERSION}/deb/Release.key \
          | gpg --dearmor -o /etc/apt/keyrings/cri-o-apt-keyring.gpg

          echo "deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://pkgs.k8s.io/addons:/cri-o:/stable:/${KUBERNETES_VERSION}/deb/ /" \
          > /etc/apt/sources.list.d/cri-o.list

          apt-get update
          apt-get install -y cri-o

          systemctl daemon-reload
          systemctl enable crio
          systemctl restart crio

          # ----------------------------------------------------
          # Kubernetes repository
          #   ----------------------------------------------------
          curl -fsSL https://pkgs.k8s.io/core:/stable:/${KUBERNETES_VERSION}/deb/Release.key \
          | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/${KUBERNETES_VERSION}/deb/ /" \
          > /etc/apt/sources.list.d/kubernetes.list

          apt-get update

          # ----------------------------------------------------
          # Install Kubernetes
          # ----------------------------------------------------
          apt-get install -y kubelet kubeadm kubectl

          apt-mark hold kubelet kubeadm kubectl
          # Initialize Kubernetes
          kubeadm init \
          --apiserver-advertise-address=10.0.1.174 \
          --pod-network-cidr=192.168.0.0/16

          # Configure kubectl
          mkdir -p /home/ubuntu/.kube
          cp /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
          chown ubuntu:ubuntu /home/ubuntu/.kube/config

          # Install Calico
          su - ubuntu -c "kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.0/manifests/calico.yaml"

          # Wait for the API server and Calico to settle
          sleep 30
          systemctl enable kubelet
          # Generate join command
          JOIN_CMD=$(kubeadm token create --print-join-command)

          # Save to SSM Parameter Store
          aws ssm put-parameter \
          --name "/k8s/join-command" \
          --value "$JOIN_CMD" \
          --type String \
          --overwrite \
          --region us-east-2

  PrivateRoute:
    Type: AWS::EC2::Route
    DependsOn: controllernode
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref controllernode
  Node1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}"
      InstanceType: t2.small
      KeyName: controller-node
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          GroupSet:
            - !Ref PrivateSecurityGroup
          SubnetId: !Ref PrivateSubnet
          PrivateIpAddress: 10.0.2.211
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eux

          export DEBIAN_FRONTEND=noninteractive

          # ----------------------------------------------------
          # Hostname ----------------------------------------------------
          hostnamectl set-hostname worker1

          # ----------------------------------------------------
          # Update system
          # ----------------------------------------------------
          apt-get update
          apt-get upgrade -y

          # ----------------------------------------------------
          # /etc/hosts (replace with your actual private IPs)
          # ----------------------------------------------------
          cat <<EOF >> /etc/hosts
          10.0.1.174 master
          10.0.2.211 worker1
          10.0.2.167 worker2
          EOF

          # ----------------------------------------------------
